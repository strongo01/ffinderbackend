[alembic]
# Path to migration scripts (relative to this ini file)
script_location = alembic

# Add your source folder so Alembic can import models
prepend_sys_path = .

# Database URL (used by env.py)
sqlalchemy.url = postgresql+psycopg://postgres:postgres@db:5432/ffinderbackend

# Optional: revision file template
# file_template = %%(rev)s_%%(slug)s

# Path separator for multiple paths
path_separator = os

# Recursive search for version locations
# recursive_version_locations = false
# ... (your existing [alembic] section should be above this)

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S